[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "unit: test thuần Python, không mở trình duyệt",
    "integration: test chạy Playwright trên trang giả lập offline",
]

[tool.coverage.run]
# Playwright (sync API) chạy trên greenlet — thiếu dòng này coverage bỏ sót code trong poster/session
concurrency = ["greenlet", "thread"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
